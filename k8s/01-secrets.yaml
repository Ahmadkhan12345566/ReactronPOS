# CHANGE these values before you actually deploy anywhere reachable.
# stringData gets base64-encoded automatically by kubectl on apply --
# you never need to encode it by hand.
apiVersion: v1
kind: Secret
metadata:
  name: posb-secrets
  namespace: reactronpos
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "rootpassword"
  DB_PASS: "rootpassword"
  JWT_SECRET: "your_super_secret_jwt_key_here"
