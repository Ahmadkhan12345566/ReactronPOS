apiVersion: apps/v1
kind: Deployment
metadata:
  name: posb-frontend
  namespace: reactronpos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: posb-frontend
  template:
    metadata:
      labels:
        app: posb-frontend
    spec:
      containers:
        - name: frontend
          image: abdulrahmansoftware/posb-frontend:v1
          ports:
            - containerPort: 5173
          readinessProbe:
            tcpSocket:
              port: 5173
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: posb-frontend
  namespace: reactronpos
spec:
  selector:
    app: posb-frontend
  ports:
    - port: 5173
      targetPort: 5173
  # ClusterIP (default) -- the Ingress (06-ingress.yaml) is now what exposes
  # this outside the cluster, so the Service itself stays internal-only.
